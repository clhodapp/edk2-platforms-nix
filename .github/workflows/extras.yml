# SPDX-License-Identifier: MIT
#
# Builds the `extras` (see configs/flake/edk2-platforms-nix/extras.nix):
# edk2-platforms packages this repository carries as pinned Nix
# expressions but does not release. Each feature is built twice, against
# the edk2 stable tag (`<name>`) and against edk2 master
# (`<name>-unstable`), each in its own job, and any job may fail
# without failing the run, since a feature package that stops building
# is a fact to record, not a reason to hold the drivers. The outcome of
# every attribute is written to extras/STATUS.md on main, and
# extras/last-good.json moves each attribute that built to this commit
# (`extras-last-good` reads it). Runs on the same pushes as release.yml
# and after the weekly pin advance, in a separate workflow so the check
# pipeline and the release stay as fast as they are.
#
# A build's outcome is a function of its derivation, so a job first
# looks for a marker of a successful build of the same derivation in
# this repository's Actions cache and builds only when there is none.
# The markers are a few bytes each, under their own key prefix; the
# build outputs themselves are kept nowhere, and nothing is pushed to
# cachix.
name: extras

on:
  push:
    branches: [main]
  schedule:
    # Weekly, an hour after release.yml's advance.
    - cron: "17 7 * * 2"
  workflow_dispatch:

# Committing the status; deleting the superseded markers.
permissions:
  contents: write
  actions: write

concurrency:
  group: extras
  cancel-in-progress: true

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      names: ${{ steps.names.outputs.names }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
      # The features, by their stable names; the core is the matrix's
      # other dimension.
      - id: names
        run: |
          names=$(nix eval --json '.#extras.x86_64-linux' --apply builtins.attrNames | jq -c 'map(select(endswith("-unstable") | not))')
          echo "names=$names" >> "$GITHUB_OUTPUT"
          echo "$names"

  build:
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.list.outputs.names) }}
        core: [stable, unstable]
    env:
      ATTR: ${{ matrix.name }}${{ matrix.core == 'unstable' && '-unstable' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            sandbox = true

      # Pull from the clhodapp cache (the toolchain and BaseTools main's
      # check run built); nothing is pushed there from here.
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: clhodapp
          skipPush: true
          extraPullNames: nix-community,numtide

      - name: Find the derivation
        id: drv
        run: |
          set -euo pipefail
          drv=$(nix eval --raw ".#extras.x86_64-linux.$ATTR.drvPath")
          edk2=$(nix eval --raw ".#extras.x86_64-linux.$ATTR.edk2Version")
          hash=$(basename "$drv")
          {
            echo "drv=$drv"
            echo "edk2=$edk2"
            echo "key=extras/$ATTR/${hash%%-*}"
          } >> "$GITHUB_OUTPUT"
          echo "$drv against edk2 $edk2"

      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: marker
        with:
          path: built
          key: ${{ steps.drv.outputs.key }}
          lookup-only: true

      - name: Build
        id: build
        if: steps.marker.outputs.cache-hit != 'true'
        env:
          DRV: ${{ steps.drv.outputs.drv }}
        run: nix build --print-build-logs --no-link "$DRV^*"

      - name: Mark the derivation built
        if: steps.build.outcome == 'success'
        env:
          DRV: ${{ steps.drv.outputs.drv }}
        run: |
          mkdir -p built
          echo "$DRV" > built/drv
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: save
        if: steps.build.outcome == 'success'
        with:
          path: built
          key: ${{ steps.drv.outputs.key }}

      # A marker for an older derivation of this attribute is never
      # looked up again.
      - name: Drop this attribute's superseded markers
        if: steps.save.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PREFIX: extras/${{ env.ATTR }}/
          KEY: ${{ steps.drv.outputs.key }}
        run: |
          set -euo pipefail
          gh cache list --repo "$GITHUB_REPOSITORY" --key "$PREFIX" --limit 100 --json id,key \
            --jq ".[] | select(.key != \"$KEY\") | \"\(.id) \(.key)\"" \
          | while read -r id key; do
              echo "Deleting $key"
              gh cache delete "$id" --repo "$GITHUB_REPOSITORY"
            done

      - name: Record the outcome
        if: always()
        env:
          NAME: ${{ matrix.name }}
          CORE: ${{ matrix.core }}
          EDK2: ${{ steps.drv.outputs.edk2 }}
          # The build is skipped on a marker, and also when the
          # attribute does not evaluate, which is a failure.
          OUTCOME: ${{ steps.marker.outputs.cache-hit == 'true' && 'success' || steps.build.outcome == 'skipped' && 'failure' || steps.build.outcome }}
        run: |
          mkdir -p outcome
          jq -n --arg name "$NAME" --arg core "$CORE" --arg attr "$ATTR" --arg edk2 "$EDK2" --arg outcome "$OUTCOME" \
            '{name: $name, core: $core, attr: $attr, edk2Version: $edk2, outcome: $outcome}' > "outcome/$ATTR.json"
          cat "outcome/$ATTR.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: outcome-${{ env.ATTR }}
          path: outcome/

  # On main only: on any other branch the push below would rebase that
  # branch onto main and push it there. A run started on another
  # branch tests the builds and records nothing.
  status:
    needs: build
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # The push below rebases onto a newer main when it has moved.
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: outcome-*
          path: outcomes
          merge-multiple: true
      - name: Write extras/last-good.json and extras/STATUS.md
        run: |
          set -euo pipefail
          mkdir -p extras
          jq -s . outcomes/*.json > "$RUNNER_TEMP/outcomes.json"
          last_good=extras/last-good.json
          [[ -e "$last_good" ]] || echo '{}' > "$last_good"

          # Every attribute that built moves to this commit; the others
          # keep the commit they last built at.
          jq --slurpfile all "$RUNNER_TEMP/outcomes.json" \
            --arg flake "github:$GITHUB_REPOSITORY/$GITHUB_SHA" --arg commit "$GITHUB_SHA" '
              reduce ($all[0][] | select(.outcome == "success")) as $o (.;
                .["x86_64-linux"][$o.attr] = {flake: $flake, commit: $commit, edk2Version: $o.edk2Version})
            ' "$last_good" > "$RUNNER_TEMP/last-good.json"
          mv "$RUNNER_TEMP/last-good.json" "$last_good"

          jq -r --slurpfile lg "$last_good" --arg sha "${GITHUB_SHA:0:12}" '
            def version(core): (map(select(.core == core)) | first | .edk2Version) // "unknown";
            def cell(o):
              if o == null then "not built"
              elif o.outcome == "success" then "success"
              else ($lg[0]["x86_64-linux"][o.attr].commit // null) as $c
                | o.outcome + (if $c then ", last built at `\($c[0:12])`" else ", never built" end)
              end;
            . as $all
            | "# Extras build status",
              "",
              "Written by extras.yml for commit `\($sha)`. Each feature is built against the edk2 stable tag as `extras.x86_64-linux.<name>` (edk2 \($all | version("stable"))) and against edk2 master as `extras.x86_64-linux.<name>-unstable` (edk2 \($all | version("unstable"))). A failure names the commit at which the attribute last built, and `extras-last-good.x86_64-linux.<attribute>` builds it from that commit.",
              "",
              "| Feature | Stable | Unstable |",
              "|---|---|---|",
              (group_by(.name)[]
                | (map(select(.core == "stable")) | first) as $s
                | (map(select(.core == "unstable")) | first) as $u
                | "| `\(.[0].name)` | \(cell($s)) | \(cell($u)) |")
          ' "$RUNNER_TEMP/outcomes.json" > extras/STATUS.md
          cat extras/STATUS.md
      # Only this workflow writes extras/, and one run of it at a time,
      # so a rebase onto a main that moved since the checkout (a release
      # run's revision commit, a pin move) cannot conflict.
      - name: Commit and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain extras)" ]]; then
            echo "The status is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extras/STATUS.md extras/last-good.json
          git commit -m "maint(extras): build status for ${GITHUB_SHA:0:12}"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          for attempt in 1 2 3 4 5; do
            if git push "$remote" HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt was rejected; rebasing onto main."
            git pull --rebase "$remote" main
          done
          exit 1
