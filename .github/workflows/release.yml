# SPDX-License-Identifier: MIT
#
# Releases the drop-in drivers, as one batch, without anyone tagging by
# hand. The version is `<edk2>.<revision>` from
# pkgs/edk2-platforms-nix/version.nix: `edk2` is the edk2 stable tag the
# batch is built against (the `edk2-src` input in flake.nix), `revision`
# counts rebuilds against that tag.
#
# What moves the version:
# - A new edk2-stable tag upstream: the weekly run moves the `edk2-src`
#   ref in flake.nix to it, re-locks, and sets `edk2` with `revision`
#   back at 0. A release follows.
# - A pin move that changes any released driver (edk2-platforms, the
#   drivers' source; nixpkgs, the toolchain; anything in flake.lock),
#   whether from the weekly advance here or from the workspace's
#   convergence: the run finds the fresh build differs from the release
#   under the current version, and, since nothing but flake.lock changed
#   since that release, bumps `revision` itself. A release follows.
# - A change to a file this repository authors that changes a driver.
#   Changes here come in bursts, and the binaries under a version must
#   not change, so the run does not release in the middle of one, and
#   it does not advance the pins either: the burst's changes are
#   released against the same upstream as the release before them.
#   The run bumps `revision` when told the burst is over (a dispatch
#   with `bump`) or once main has had no change of its own for a week
#   (the weekly run finds it so), refuses otherwise, and after the
#   burst-end release starts the run that advances the pins again.
#   A burst that moves the edk2 tag itself is a new series: the
#   version follows the lock and `v<newtag>.0` is created at once.
#
# Every run: find the release under the version and whether this
# repository's own files changed since it, advance the pins unless
# they did (the weekly run and a dispatch with `advance`), reconcile
# `edk2` in version.nix with the lock, build the stable checks, build
# every released driver as the manifest lists them, then compare with
# the release under the version's tag: none, create it at this commit;
# identical, done; different, the rules above.
# A commit this workflow pushes (a pin advance, a reconciled version, an
# automatic bump) carries the workflow's own token, which starts no
# other run; the release for it is created by the run that pushed it.
# The `unstable` packages are advanced here but checked by check.yml
# only, and the `extras` are built by extras.yml only.
name: release

on:
  push:
    branches: [main]
  schedule:
    # Weekly, Tuesday morning UTC.
    - cron: "17 6 * * 2"
  workflow_dispatch:
    inputs:
      advance:
        description: Advance the pins (edk2 stable tag, edk2 master, edk2-platforms) as the weekly run does
        required: false
        default: false
        type: boolean
      bump:
        description: Release main now if the drivers changed, whatever changed them (the end of a burst of changes)
        required: false
        default: false
        type: boolean

# Pushing the reconciled version and creating the release; starting
# the run that resumes tracking upstream after a burst.
permissions:
  contents: write
  actions: write

# Runs serialize: two at once could both find the tag missing.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Actions pinned by commit, as in check.yml: what this job produces
    # is loaded into firmware, so the pipeline that produces it must not
    # change under a moving tag.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # The whole history: the comparison with the released commit
          # below diffs against it.
          fetch-depth: 0

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            sandbox = true

      # Substitute from the clhodapp cache, where main's check run pushed
      # the drivers, so this run downloads the very store paths a Nix
      # user at the same pins gets rather than compiling again. A public
      # cache needs no credentials to read; nothing is pushed from here.
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: clhodapp
          skipPush: true
          extraPullNames: nix-community,numtide

      # The release under the version in version.nix, and whether this
      # repository's own files changed since it. The files the workflows
      # write themselves (the locks, the version file, the extras
      # status) are not its own changes. Own changes since a release
      # mean a burst of work is in progress: the drivers under that
      # version must not change, so nothing can be released until the
      # burst ends, and the pins stay where the release has them.
      - name: Find the release under this version and what changed since it
        id: since
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version_file=pkgs/edk2-platforms-nix/version.nix
          own=(-- . ':!flake.lock' ':!tests/dependencies/flake.lock' ":!$version_file" ':!extras/STATUS.md')
          tag="v$(nix eval --raw --file "$version_file" edk2).$(nix eval --file "$version_file" revision)"
          released=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish 2>/dev/null || true)
          changed=""
          if [[ -n "$released" ]]; then
            changed=$(git diff --name-only "$released" HEAD "${own[@]}")
          fi
          last_change=$(git log -1 --format=%ct "${own[@]}")
          quiet_days=$(( ($(date +%s) - last_change) / 86400 ))
          if [[ -z "$released" ]]; then
            echo "No release $tag yet."
          elif [[ -z "$changed" ]]; then
            echo "Release $tag is at $released; nothing of this repository's own changed since."
          else
            echo "Release $tag is at $released; this repository's own files changed since (last $quiet_days days ago):"
            while read -r f; do echo "  $f"; done <<<"$changed"
          fi
          {
            echo "tag=$tag"
            echo "released=$released"
            echo "locked=$([[ -n "$changed" ]] && echo true || echo false)"
            echo "quiet_days=$quiet_days"
          } >> "$GITHUB_OUTPUT"

      - name: Advance the pins, then reconcile the version with the lock
        env:
          GH_TOKEN: ${{ github.token }}
          ADVANCE: ${{ github.event_name == 'schedule' || inputs.advance == true }}
          LOCKED: ${{ steps.since.outputs.locked }}
          TAG: ${{ steps.since.outputs.tag }}
        run: |
          set -euo pipefail
          version_file=pkgs/edk2-platforms-nix/version.nix

          # The edk2 tag the lock names, as its YYYYMM.
          locked_edk2() {
            jq -r '.nodes."edk2-src".original.ref' flake.lock | sed -E 's|^refs/tags/edk2-stable||'
          }

          if [[ "$ADVANCE" == "true" && "$LOCKED" == "true" ]]; then
            echo "::notice::Not advancing the pins: this repository's own files changed since release $TAG, so the drivers cannot be released until that burst ends (start this workflow with \`bump\`, or leave main unchanged for a week). The pins stay where the release has them until then."
            ADVANCE=false
          fi

          if [[ "$ADVANCE" == "true" ]]; then
            latest=$(git ls-remote --tags https://github.com/tianocore/edk2 'refs/tags/edk2-stable*' \
              | sed -nE 's|.*refs/tags/edk2-stable([0-9]+)$|\1|p' | sort -n | tail -n1)
            current=$(locked_edk2)
            if (( latest > current )); then
              echo "edk2 tagged edk2-stable$latest (this build is against $current); moving edk2-src to it."
              sed -i -E "s|(edk2-src\.url = \"git\+https://github\.com/tianocore/edk2\?ref=refs/tags/edk2-stable)[0-9]+|\1$latest|" flake.nix
              grep -q "edk2-stable$latest&" flake.nix
              nix flake update edk2-src
            else
              echo "edk2-stable$current is upstream's newest stable tag."
            fi
            nix flake update edk2-unstable-src edk2-platforms
          fi

          edk2=$(locked_edk2)
          current=$(nix eval --raw --file "$version_file" edk2)
          if [[ "$edk2" != "$current" ]]; then
            echo "The lock is at edk2-stable$edk2, version.nix at $current; version becomes $edk2.0."
            sed -i -E \
              -e "s/^  edk2 = \"[0-9]+\";/  edk2 = \"$edk2\";/" \
              -e "s/^  revision = [0-9]+;/  revision = 0;/" \
              "$version_file"
            [[ "$(nix eval --raw --file "$version_file" edk2)" == "$edk2" ]]
          fi

          if git diff --quiet; then
            echo "The version agrees with the lock."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.nix flake.lock "$version_file"
          git commit -m "maint: advance pins (edk2-stable$edk2, edk2-platforms $(jq -r '.nodes."edk2-platforms".locked.rev' flake.lock | cut -c1-12))"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" HEAD:main

      # The checks of the stable variants, and the formatter: every
      # check named after a released driver without an -unstable
      # suffix, so a new drop-in's checks are picked up by name.
      - name: Run the stable checks
        run: |
          set -euo pipefail
          nix build -L -o manifest '.#release-manifest'
          attrs=$(jq -r '.[].attr' manifest | sort -u)
          checks=$(nix eval --json '.#checks.x86_64-linux' --apply builtins.attrNames | jq -r '.[]')
          targets=(.#checks.x86_64-linux.treefmt)
          for a in $attrs; do
            if grep -qx "$a" <<<"$checks"; then targets+=(".#checks.x86_64-linux.$a"); fi
          done
          printf 'check: %s\n' "${targets[@]}"
          nix build --print-build-logs --no-link "${targets[@]}"

      # systemd-boot's drop-in directory requires the architecture suffix
      # (x64.efi, aa64.efi), so the release artifacts are named the way
      # they are meant to be installed; the manifest carries the names.
      - name: Build every released driver
        run: |
          set -euo pipefail
          rm -rf artifacts
          mkdir -p artifacts
          nix build -L -o manifest '.#release-manifest'
          jq -r '.[] | "\(.attr) \(.module) \(.file)"' manifest | while read -r attr module file; do
            nix build -L -o "result-$attr" ".#$attr"
            install -m0644 "result-$attr/$module.efi" "artifacts/$file"
          done
          cd artifacts
          sha256sum ./*.efi > SHA256SUMS
          cat SHA256SUMS

      - name: Compare with the release under this version; bump or refuse
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump == true }}
          RELEASED: ${{ steps.since.outputs.released }}
          LOCKED: ${{ steps.since.outputs.locked }}
          QUIET_DAYS_SO_FAR: ${{ steps.since.outputs.quiet_days }}
          # A burst of changes is over once main has had none for this
          # long; the weekly run then releases what accumulated.
          QUIET_DAYS: 7
        run: |
          set -euo pipefail
          version_file=pkgs/edk2-platforms-nix/version.nix
          version=$(nix eval --raw '.#ext4-dxe.version')
          tag="v$version"

          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "No release $tag yet."
            echo "action=create" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --output released.SHA256SUMS
          if cmp -s released.SHA256SUMS artifacts/SHA256SUMS; then
            echo "::notice::Release $tag exists and matches this build; nothing to do."
            echo "action=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          diff released.SHA256SUMS artifacts/SHA256SUMS || true

          # Who bumps: the run, when only pins moved since the released
          # commit; otherwise a burst of this repository's own changes
          # is in progress, and the run bumps when told the burst is
          # over or when main has been quiet for long enough, and
          # refuses in the middle of one. (The release and what changed
          # since it were found before the pins were advanced; the pins
          # are not advanced during a burst.)
          echo "Release $tag is at $RELEASED."
          burst_ended=false
          if [[ "$LOCKED" != "true" ]]; then
            reason="only pins moved"
          elif [[ "$BUMP" == "true" ]]; then
            reason="asked to"
            burst_ended=true
          elif (( QUIET_DAYS_SO_FAR >= QUIET_DAYS )); then
            reason="main's last change is $QUIET_DAYS_SO_FAR days old"
            burst_ended=true
          else
            echo "::error::This commit builds drivers that differ from release $tag, and this repository's own files changed since it (last $QUIET_DAYS_SO_FAR days ago). Start this workflow with \`bump\` checked to release it now; it releases itself once main has had no change for $QUIET_DAYS days."
            exit 1
          fi
          echo "burst_ended=$burst_ended" >> "$GITHUB_OUTPUT"

          revision=$(nix eval --file "$version_file" revision)
          next=$((revision + 1))
          echo "Revision $revision becomes $next ($reason)."
          sed -i -E "s/^  revision = [0-9]+;/  revision = $next;/" "$version_file"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$version_file"
          git commit -m "maint: revision $next, the drivers changed ($reason)"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" HEAD:main
          # The same bytes under the new name; rebuilt so the artifacts
          # are the store paths at the commit the release names.
          rm -rf artifacts
          mkdir -p artifacts
          jq -r '.[] | "\(.attr) \(.module) \(.file)"' manifest | while read -r attr module file; do
            nix build -L -o "result-$attr" ".#$attr"
            install -m0644 "result-$attr/$module.efi" "artifacts/$file"
          done
          (cd artifacts && sha256sum ./*.efi > SHA256SUMS)
          echo "action=create" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: edk2-platforms-nix-efi
          path: artifacts/

      - name: Create the release
        if: steps.compare.outputs.action == 'create'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(nix eval --raw '.#ext4-dxe.version')
          tag="v$version"
          commit=$(git rev-parse HEAD)
          edk2_rev=$(nix eval --raw '.#ext4-dxe.edk2Rev')
          platforms_rev=$(nix eval --raw '.#ext4-dxe.platformsRev')
          nixpkgs_rev=$(jq -r '.nodes.nixpkgs.locked.rev' flake.lock)
          {
            cat .github/release-notes-preamble.md
            echo
            echo "## This release"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| edk2 core | [edk2-stable${version%%.*}](https://github.com/tianocore/edk2/releases/tag/edk2-stable${version%%.*}) (\`$edk2_rev\`) |"
            echo "| edk2-platforms | [tianocore/edk2-platforms@${platforms_rev:0:12}](https://github.com/tianocore/edk2-platforms/tree/$platforms_rev) |"
            echo "| Toolchain | nixpkgs \`nixos-26.05\` at [\`${nixpkgs_rev:0:12}\`](https://github.com/NixOS/nixpkgs/commit/$nixpkgs_rev) |"
            echo "| Built at | [\`${commit:0:12}\`](https://github.com/$GITHUB_REPOSITORY/commit/$commit) |"
          } > notes.md

          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$commit" \
            --title "$tag" \
            --notes-file notes.md \
            artifacts/*.efi \
            artifacts/SHA256SUMS
          echo "::notice::Created release $tag at $commit."

      # The burst is over and its changes are released at the pins the
      # burst kept, so tracking upstream resumes now rather than at the
      # next weekly run: the next run advances the pins and, if any
      # driver changed under them, releases again. A workflow_dispatch
      # is the one event the workflow's own token does start.
      - name: Resume tracking upstream
        if: steps.compare.outputs.burst_ended == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" -f advance=true
