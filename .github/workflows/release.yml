# SPDX-License-Identifier: MIT
#
# Releases the driver without anyone tagging by hand. The version is
# `<edk2>.<revision>` from pkgs/ext4-dxe/ext4-dxe/version.nix: `edk2` is
# the edk2 stable tag the driver is built against (the `edk2-src` input
# in flake.nix), `revision` counts rebuilds against that tag.
#
# What moves the version:
# - A new edk2-stable tag upstream: the weekly run moves the `edk2-src`
#   ref in flake.nix to it, re-locks, and sets `edk2` with `revision`
#   back at 0. A release follows.
# - A pin move that changes the driver (edk2-platforms, the driver's own
#   source; nixpkgs, the toolchain; anything in flake.lock), whether
#   from the weekly advance here or from the workspace's convergence:
#   the run finds the fresh build differs from the release under the
#   current version, and, since nothing but flake.lock changed since
#   that release, bumps `revision` itself. A release follows.
# - A change to a file this repository authors that changes the driver:
#   the run fails, since the binaries under a version must not change
#   and this change is not a pin move. Bumping `revision` by hand and
#   pushing is what releases it.
#
# Every run: reconcile `edk2` in version.nix with the lock (the weekly
# run and a dispatch with `advance` first move the pins), build the
# stable checks, build both architectures, then compare with the
# release under the version's tag: none, create it at this commit;
# identical, done; different, the rule above. A commit this workflow
# pushes (a pin advance, a reconciled version, an automatic bump)
# carries the workflow's own token, which starts no other run; the
# release for it is created by the run that pushed it. The `unstable`
# packages are advanced here but checked by check.yml only.
name: release

on:
  push:
    branches: [main]
  schedule:
    # Weekly, Tuesday morning UTC.
    - cron: "17 6 * * 2"
  workflow_dispatch:
    inputs:
      advance:
        description: Advance the pins (edk2 stable tag, edk2 master, edk2-platforms) as the weekly run does
        required: false
        default: false
        type: boolean

# Pushing the reconciled version and creating the release.
permissions:
  contents: write

# Runs serialize: two at once could both find the tag missing.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Actions pinned by commit, as in check.yml: what this job produces
    # is loaded into firmware, so the pipeline that produces it must not
    # change under a moving tag.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # The whole history: the comparison with the released commit
          # below diffs against it.
          fetch-depth: 0

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes
            sandbox = true

      # Substitute from the clhodapp cache, where main's check run pushed
      # both drivers, so this run downloads the very store paths a Nix
      # user at the same pins gets rather than compiling again. A public
      # cache needs no credentials to read; nothing is pushed from here.
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: clhodapp
          skipPush: true
          extraPullNames: nix-community,numtide

      - name: Advance the pins, then reconcile the version with the lock
        env:
          GH_TOKEN: ${{ github.token }}
          ADVANCE: ${{ github.event_name == 'schedule' || inputs.advance == true }}
        run: |
          set -euo pipefail
          version_file=pkgs/ext4-dxe/ext4-dxe/version.nix

          # The edk2 tag the lock names, as its YYYYMM.
          locked_edk2() {
            jq -r '.nodes."edk2-src".original.ref' flake.lock | sed -E 's|^refs/tags/edk2-stable||'
          }

          if [[ "$ADVANCE" == "true" ]]; then
            latest=$(git ls-remote --tags https://github.com/tianocore/edk2 'refs/tags/edk2-stable*' \
              | sed -nE 's|.*refs/tags/edk2-stable([0-9]+)$|\1|p' | sort -n | tail -n1)
            current=$(locked_edk2)
            if (( latest > current )); then
              echo "edk2 tagged edk2-stable$latest (this build is against $current); moving edk2-src to it."
              sed -i -E "s|(edk2-src\.url = \"git\+https://github\.com/tianocore/edk2\?ref=refs/tags/edk2-stable)[0-9]+|\1$latest|" flake.nix
              grep -q "edk2-stable$latest&" flake.nix
              nix flake update edk2-src
            else
              echo "edk2-stable$current is upstream's newest stable tag."
            fi
            nix flake update edk2-unstable-src edk2-platforms
          fi

          edk2=$(locked_edk2)
          current=$(nix eval --raw --file "$version_file" edk2)
          if [[ "$edk2" != "$current" ]]; then
            echo "The lock is at edk2-stable$edk2, version.nix at $current; version becomes $edk2.0."
            sed -i -E \
              -e "s/^  edk2 = \"[0-9]+\";/  edk2 = \"$edk2\";/" \
              -e "s/^  revision = [0-9]+;/  revision = 0;/" \
              "$version_file"
            [[ "$(nix eval --raw --file "$version_file" edk2)" == "$edk2" ]]
          fi

          if git diff --quiet; then
            echo "The version agrees with the lock."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.nix flake.lock "$version_file"
          git commit -m "maint: advance pins (edk2-stable$edk2, edk2-platforms $(jq -r '.nodes."edk2-platforms".locked.rev' flake.lock | cut -c1-12))"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" HEAD:main

      - name: Run the stable checks
        run: |
          nix build --print-build-logs --no-link \
            '.#checks.x86_64-linux.ext4-dxe-vm' \
            '.#checks.x86_64-linux.ext4-dxe-vm-aarch64' \
            '.#checks.x86_64-linux.treefmt'

      # systemd-boot's drop-in directory requires the architecture suffix
      # (x64.efi, aa64.efi), so the release artifacts are named the way
      # they are meant to be installed.
      - name: Build both architectures
        run: |
          rm -rf artifacts
          mkdir -p artifacts
          nix build -L '.#ext4-dxe' -o result-x64
          nix build -L '.#ext4-dxe-aarch64' -o result-aa64
          install -m0644 result-x64/Ext4Dxe.efi artifacts/ext4_x64.efi
          install -m0644 result-aa64/Ext4Dxe.efi artifacts/ext4_aa64.efi
          cd artifacts
          sha256sum ./*.efi > SHA256SUMS
          cat SHA256SUMS

      - name: Compare with the release under this version; bump or refuse
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version_file=pkgs/ext4-dxe/ext4-dxe/version.nix
          version=$(nix eval --raw '.#ext4-dxe.version')
          tag="v$version"

          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "No release $tag yet."
            echo "action=create" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --output released.SHA256SUMS
          if cmp -s released.SHA256SUMS artifacts/SHA256SUMS; then
            echo "::notice::Release $tag exists and matches this build; nothing to do."
            echo "action=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          diff released.SHA256SUMS artifacts/SHA256SUMS || true

          # What changed since the released commit decides who bumps.
          released=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)
          changed=$(git diff --name-only "$released" HEAD)
          echo "Changed since $tag ($released):"
          printf '  %s\n' $changed
          if [[ "$changed" == "flake.lock" ]]; then
            revision=$(nix eval --file "$version_file" revision)
            next=$((revision + 1))
            echo "Only pins moved; revision $revision becomes $next."
            sed -i -E "s/^  revision = [0-9]+;/  revision = $next;/" "$version_file"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$version_file"
            git commit -m "maint: revision $next, the driver changed under the pin move"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" HEAD:main
            # The same bytes under the new name; rebuilt so the artifacts
            # are the store paths at the commit the release names.
            nix build -L '.#ext4-dxe' -o result-x64
            nix build -L '.#ext4-dxe-aarch64' -o result-aa64
            install -m0644 result-x64/Ext4Dxe.efi artifacts/ext4_x64.efi
            install -m0644 result-aa64/Ext4Dxe.efi artifacts/ext4_aa64.efi
            (cd artifacts && sha256sum ./*.efi > SHA256SUMS)
            echo "action=create" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::This commit builds a driver that differs from release $tag, and the change since it is not only a pin move. Advance \`revision\` in $version_file to release it."
          exit 1

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ext4-dxe-efi
          path: artifacts/

      - name: Create the release
        if: steps.compare.outputs.action == 'create'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(nix eval --raw '.#ext4-dxe.version')
          tag="v$version"
          commit=$(git rev-parse HEAD)
          edk2_rev=$(nix eval --raw '.#ext4-dxe.edk2Rev')
          ext4pkg_rev=$(nix eval --raw '.#ext4-dxe.ext4PkgRev')
          nixpkgs_rev=$(jq -r '.nodes.nixpkgs.locked.rev' flake.lock)
          {
            cat .github/release-notes-preamble.md
            echo
            echo "## This release"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| edk2 core | [edk2-stable${version%%.*}](https://github.com/tianocore/edk2/releases/tag/edk2-stable${version%%.*}) (\`$edk2_rev\`) |"
            echo "| Ext4Pkg source | [tianocore/edk2-platforms@${ext4pkg_rev:0:12}](https://github.com/tianocore/edk2-platforms/tree/$ext4pkg_rev/Features/Ext4Pkg) |"
            echo "| Toolchain | nixpkgs \`nixos-26.05\` at [\`${nixpkgs_rev:0:12}\`](https://github.com/NixOS/nixpkgs/commit/$nixpkgs_rev) |"
            echo "| Built at | [\`${commit:0:12}\`](https://github.com/$GITHUB_REPOSITORY/commit/$commit) |"
          } > notes.md

          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$commit" \
            --title "$tag" \
            --notes-file notes.md \
            artifacts/ext4_x64.efi \
            artifacts/ext4_aa64.efi \
            artifacts/SHA256SUMS
          echo "::notice::Created release $tag at $commit."
